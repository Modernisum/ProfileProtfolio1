<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shivank professional profile.">
  <title>Shivank Profile</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/Icon-maskable-512.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000515;
      font-family: Arial, sans-serif;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000515;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
    }

    .image-container {
      width: 100px;
      height: 100px;
      border-radius: 30px;
      padding: 8px;
      background: linear-gradient(135deg, #36D1DC, #5B86E5);
      box-shadow:
        -2px 0px 20px pink,
        2px 0px 20px blue;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: float 2s ease-in-out infinite alternate;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      object-fit: cover;
      background-color: #000515;
    }

    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(4px); }
    }
  </style>

  <script>
    var serviceWorkerVersion = "120675273";
  </script>
  <script src="flutter.js" defer></script>
</head>

<body>
<!-- 🌟 Splash Screen -->
<div id="splash">
  <div class="image-container">
    <img src="assets/images/image1.png" alt="Logo" />
  </div>
</div>

<!-- Flutter app load -->
<script>
  window.addEventListener('load', function (ev) {
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: "120675273",
      },
      onEntrypointLoaded: function (engineInitializer) {
        engineInitializer.initializeEngine().then(function (appRunner) {
          document.getElementById('splash')?.remove();
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
